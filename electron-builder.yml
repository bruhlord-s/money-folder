appId: com.money-folder.app
productName: money-folder
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!{electron.vite,drizzle}.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{lefthook.yml,commitlint.config.mjs,knip.json,release-please-config.json,.release-please-manifest.json}'
  - '!.github/*'
extraResources:
  - from: src/main/db/migrations
    to: migrations
asarUnpack:
  - resources/**
win:
  executableName: money-folder
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
