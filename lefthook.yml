pre-commit:
  # Sequential on purpose: both tools rewrite the same files, Prettier goes last.
  jobs:
    - name: eslint
      glob: '*.{ts,mts,js,mjs,cjs,vue}'
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true
    - name: prettier
      glob: '*.{ts,mts,js,mjs,cjs,vue,json,yml,yaml,css,html,md}'
      run: pnpm prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
    # add `pnpm test` here once tests exist

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}
